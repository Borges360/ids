name: INTEIRO P0 gates

# Trigger-to-profile contract from RFC-001 §14.1 (WP-21). The standardized
# CI workflow (ci.yml) keeps its unit checks; this workflow runs the P0
# profiles. Protected profiles always run the full suite (no --changed).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      INTEIRO_GATE_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || github.ref == 'refs/heads/main' && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run ci
        env:
          TOKEN_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          INTEIRO_FULL_MATRIX: ${{ github.event_name == 'schedule' && '1' || '0' }}
      - run: npm run test:browser-gate
      - run: npm run test:stories
      - name: Resolve deterministic context files
        run: node packages/cli/src/cli.ts agents install pi --yes --json
      - name: Bind task to resolved context
        run: node packages/cli/src/cli.ts context resolve --record --json
      - name: Strict P0 gate
        run: node packages/cli/src/cli.ts gate run --profile "$INTEIRO_GATE_PROFILE" --start --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inteiro-validation
          path: |
            playwright-report/
            artifacts/screenshots/
            artifacts/p0-patterns/
            .inteiro/reports/
            dist/site/release.json
