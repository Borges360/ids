<!doctype html>
<html lang="pt-BR" data-in-theme="light" data-in-density="calm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Preferências · INTEIRO</title>
    <link rel="stylesheet" href="/__inteiro__/composition.css" />
  </head>
  <body class="in-composition">
    <main class="in-content-container">
      <header class="in-page-header"><h1>Preferências</h1></header>
      <div class="in-field-group">
        <label for="theme">Tema</label
        ><select class="in-select" id="theme">
          <option value="light">Claro</option>
          <option value="dark">Escuro</option>
          <option value="contrast-dark">Contraste escuro</option>
          <option value="contrast-light">Contraste claro</option>
        </select>
      </div>
      <div class="in-field-group">
        <label for="density">Densidade</label
        ><select class="in-select" id="density">
          <option value="calm">Calma</option>
          <option value="focus">Foco</option>
        </select>
      </div>
      <section class="in-card">
        <h2>Documento de teste</h2>
        <p>Revise os dados antes de concluir.</p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
