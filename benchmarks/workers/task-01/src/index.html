<!doctype html>
<html lang="pt-BR" data-in-theme="light" data-in-density="calm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro · INTEIRO</title>
    <link rel="stylesheet" href="/__inteiro__/composition.css" />
  </head>
  <body class="in-composition">
    <main class="in-content-container">
      <header class="in-page-header"><h1>Cadastro</h1></header>
      <form>
        <div class="in-field-group">
          <label for="name">Nome</label
          ><input class="in-input" id="name" name="name" type="text" />
        </div>
        <div class="in-field-group">
          <label for="email">E-mail</label
          ><input class="in-input" id="email" name="email" type="email" />
        </div>
        <button class="in-button in-button--commit" type="submit">
          Criar cadastro
        </button>
      </form>
      <p role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
